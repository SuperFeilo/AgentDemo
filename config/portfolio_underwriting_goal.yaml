# ──────────────────────────────────────────────────────────────
# ANATOMY COMPONENT: GOAL  (agent #3b — Underwriting Quality Agent)
# Part of the Portfolio Journey Analyst system.
# ──────────────────────────────────────────────────────────────
goal:
  id: portfolio-underwriting-quality-v1
  statement: >
    Evaluate underwriting judgment on a bound commercial risk using the
    notes, risk score, site inspection and bind fact tables. Produce a
    verdict: WELL-UNDERWRITTEN, ACCEPTABLE, or MISPRICED.
  success_criteria:
    - Note/risk/inspection figures come from the warehouse
    - Rate overrides and inspection flags are detected and scored
    - Every cited signal maps to a stage-flow lineage node
  constraints:
    max_steps: 14
    max_tool_errors: 2
    max_cost_units: 35
    well_threshold: 70
    acceptable_threshold: 40
  skills_to_load:
    - underwriting_quality
    - verification
    - citation_policy