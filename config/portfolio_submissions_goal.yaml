# ──────────────────────────────────────────────────────────────
# ANATOMY COMPONENT: GOAL  (agent #3a — Submissions Quality Agent)
# Part of the Portfolio Journey Analyst system.
# ──────────────────────────────────────────────────────────────
goal:
  id: portfolio-submissions-quality-v1
  statement: >
    Evaluate submission quality for a single commercial submission or
    a broker/class segment using the portfolio warehouse. Produce a
    verdict: STRONG SUBMISSION, ACCEPTABLE, or WEAK SUBMISSION.
  success_criteria:
    - Completeness and broker-pattern numbers come from the warehouse
    - Every cited signal has a stage placement in the lineage graph
    - No verdict bases on broker label alone — broker pattern needs a numeric figure
  constraints:
    max_steps: 12
    max_tool_errors: 2
    max_cost_units: 30
    strong_threshold: 70
    acceptable_threshold: 40
  skills_to_load:
    - submission_quality
    - verification
    - citation_policy